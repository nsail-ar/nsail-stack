name: CI

# Build, test and pack on every pull request and every push to main. A run on main (a push,
# or a manual dispatch to retry one) is a release: the packages go to this organization's
# GitHub Packages feed as <VERSION_PREFIX>.<run> and the commit is tagged v<that version>,
# which is what a consumer pins. A pull request packs a -pr prerelease it never publishes.
# To start a new minor or major line, change VERSION_PREFIX.
#
# The house restores from that feed and nowhere else: it serves a push as it lands, where
# nuget.org serves one package by package over minutes to an hour, and a release that waits
# for it holds every story behind the pin. nuget.org and npm are the public shelf, and take a
# version only once a product has released on it: the `publish` job below.
#
# nuget.org is reached by Trusted Publishing: the NuGet/login step trades this run's OIDC
# token for a short-lived key, against a policy on the NSail nuget.org account that names
# this repository and this workflow file. npm is reached the same way, for @nsail/stack and
# @nsail/ui at the same version. No API key for either is stored anywhere.
#
# GitHub-hosted runners, never the monorepo's self-hosted iron: this repository is public,
# and a fork's pull request on a self-hosted runner runs a stranger's code on our machine.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/review.yml'
      - '.github/review-reads.sh'
  schedule:
    - cron: '40 */6 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: "A released version (x.y.z) to put on nuget.org and npm - empty builds and releases main"
        required: false
        type: string
        default: ""

permissions:
  contents: read

# A PR's run gives way to its next push; a release on main never does — cancelled after its
# publish it would leave a version on the feed with no tag and no bump. The public shelf
# queues apart: in the releases' group, a scheduled run would take the place of a release
# waiting its turn.
concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.publish) && 'publish' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'schedule' && !inputs.publish
    runs-on: ubuntu-latest
    # The build and the publish take most of half an hour, and compiling the monorepo before
    # its bump some twenty minutes more.
    timeout-minutes: 75

    permissions:
      contents: write
      packages: write

    # The data harnesses create throwaway databases on a real Postgres. TestDatabase connects
    # as postgres@localhost and takes the password from PGPASSWORD (ConnectionStrings.Complete).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGPASSWORD: ci
      DOTNET_NOLOGO: true
      VERSION_PREFIX: '0.1'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # The build is a required check, so it must report; a pull request that changes only
      # markdown reports without building. A push to main already skips markdown (paths-ignore).
      - name: Scope
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          if [ -n "$files" ] && ! echo "$files" | grep -qv '\.md$'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Version
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "VERSION=$VERSION_PREFIX.${{ github.run_number }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$VERSION_PREFIX.${{ github.run_number }}-pr.${{ github.event.pull_request.number || 'manual' }}" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-dotnet@v6
        if: steps.scope.outputs.docs != 'true'
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v5
        if: steps.scope.outputs.docs != 'true'
        with:
          node-version: 24
          cache: npm

      # The sample's host builds its React client during the .NET build.
      - name: npm install
        if: steps.scope.outputs.docs != 'true'
        run: npm ci

      # The plugin is a deliverable of the same tag as the packages: a manifest that does not
      # load would reach every product's builder silently.
      - name: Validate the plugin
        if: steps.scope.outputs.docs != 'true'
        run: |
          npx --yes @anthropic-ai/claude-code@latest plugin validate .claude-plugin/marketplace.json
          npx --yes @anthropic-ai/claude-code@latest plugin validate plugins/nsail-stack

      # The backup tests run pg_dump, pg_restore and psql against the service, and pg_dump
      # refuses a server of a newer major than its own: the runner's client is older than the
      # service image. Put first on the PATH, because /usr/bin's wrapper picks the runner's own
      # cluster for localhost.
      - name: Postgres client
        if: steps.scope.outputs.docs != 'true'
        run: |
          major=18  # the major of the postgres service image above
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends "postgresql-client-$major"
          echo "/usr/lib/postgresql/$major/bin" >> "$GITHUB_PATH"

      - name: Restore
        if: steps.scope.outputs.docs != 'true'
        run: dotnet restore NSail.sln

      - name: Build
        if: steps.scope.outputs.docs != 'true'
        run: dotnet build NSail.sln --configuration Release --no-restore -p:Version=$VERSION

      # After the build: the sample's sdk.ts is generated from the .NET Sdk assembly and is not
      # committed.
      - name: npm typecheck and test
        if: steps.scope.outputs.docs != 'true'
        run: |
          npm run typecheck
          npm test

      - name: Test
        if: steps.scope.outputs.docs != 'true'
        run: dotnet test NSail.sln --configuration Release --no-build

      - name: Pack
        if: steps.scope.outputs.docs != 'true'
        run: dotnet pack NSail.sln --configuration Release --no-build -p:Version=$VERSION --output artifacts

      # The React packages ship at the NuGet version, and @nsail/ui names @nsail/stack at that
      # same version: the checkout keeps 0.1.0, the workspace's own number, which only this run
      # replaces.
      - name: Pack npm
        if: steps.scope.outputs.docs != 'true'
        run: |
          npm pkg set version=$VERSION --workspace=@nsail/stack --workspace=@nsail/ui
          npm pkg set "dependencies.@nsail/stack=$VERSION" --workspace=@nsail/ui
          npm run build --workspace=@nsail/stack
          npm run build --workspace=@nsail/ui
          mkdir -p artifacts/npm
          npm pack --workspace=@nsail/stack --workspace=@nsail/ui --pack-destination artifacts/npm

      # What the `publish` job puts on the public shelf: a release has this artifact's
      # retention to be taken by a product's release.
      - uses: actions/upload-artifact@v5
        if: steps.scope.outputs.docs != 'true'
        with:
          name: packages
          path: artifacts/*
          retention-days: 14

      # The feed holds each package under this repository (the RepositoryUrl its nuspec
      # carries), and answers no restore without a token: a consumer's nuget.config names the
      # variable its token comes in.
      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: Tag
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      # The monorepo pins the version every restore takes (its Directory.Build.props), and
      # this is the one hand that moves it: a complete release reaches every kit and app with
      # nobody bumping anything. The monorepo is restored and compiled at the new version
      # first, so a bump never turns its main red. A restore that fails is the feed's or its
      # token's, and reds this run. A compile that fails is the code's: the bump is not pushed,
      # and the story that released it is told, whose monorepo PR moves the pin together with
      # the adaptation. Only forward: a slower run, or a PR that moved the pin already, is left
      # alone.
      - name: Bump the monorepo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.NSAIL_CREW_PAT }}
          GITHUB_PKG_PAT: ${{ secrets.NSAIL_CREW_PKG_PAT }}
        run: |
          STORY=$(git log -1 --format=%s | sed -n 's/^nsail#\([0-9]*\):.*/\1/p')
          cd "$RUNNER_TEMP"
          git clone --quiet --depth 20 "https://x-access-token:${GH_TOKEN}@github.com/nsail-ar/nsail.git" mono
          cd mono
          git config user.name "release"
          git config user.email "release@nsail.ar"
          behind() {
            current=$(sed -n 's:.*<NSailStackVersion>\(.*\)</NSailStackVersion>.*:\1:p' Directory.Build.props)
            [ "$current" != "$VERSION" ] && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)" = "$VERSION" ]
          }
          move() {
            sed -i "s:<NSailStackVersion>$current</NSailStackVersion>:<NSailStackVersion>$VERSION</NSailStackVersion>:" Directory.Build.props
          }
          behind || { echo "the monorepo is at $current already - nothing to move"; exit 0; }
          move
          if ! dotnet restore NSail.sln --no-http-cache -p:NuGetAudit=false > ../mono-restore.log 2>&1; then
            tail -30 ../mono-restore.log
            echo "::error::the monorepo does not restore at v$VERSION - the feed or its token, not the code"
            exit 1
          fi
          if ! dotnet build NSail.sln --configuration Release --no-restore > ../mono-build.log 2>&1; then
            FAILED=$(grep -E ': error [A-Z]+[0-9]+:' ../mono-build.log | sed 's:^.*/mono/::; s: \[.*$::' | sort -u | head -20 || true)
            [ -n "$FAILED" ] || FAILED=$(tail -20 ../mono-build.log)
            echo "::warning::the monorepo does not compile at v$VERSION - the bump is not pushed"
            echo "$FAILED"
            if [ -n "$STORY" ]; then
              printf 'Stack `v%s` is released, but the monorepo does not compile at it, so the bump was not pushed. The monorepo PR of this story (or of the earlier release that broke it) moves `NSailStackVersion` to this version together with the adaptation:\n\n```\n%s\n```\n' "$VERSION" "$FAILED" > ../bump-red.md
              gh issue comment "$STORY" -R nsail-ar/nsail --body-file ../bump-red.md
            fi
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main && git reset --quiet --hard origin/main
            behind || { echo "the monorepo is at $current already - nothing to move"; exit 0; }
            move
            git commit --quiet -m "stack: v$VERSION" -- Directory.Build.props
            git push --quiet origin HEAD:main && { echo "the monorepo moved $current -> $VERSION"; exit 0; }
            sleep $((attempt * 5))
          done
          echo "::error::could not push the bump to v$VERSION after 5 attempts"; exit 1

  # The public shelf. A version goes to nuget.org and npm once a product has released on it:
  # on the schedule, the version the monorepo's newest release pins; dispatched, the one asked
  # for. The files are the ones that version's build packed (its `packages` artifact), so what
  # the world installs is what the release ran. The version's release page here is the mark
  # that it is public, and a run that finds it does nothing. No product restores from the
  # shelf, so a failure here reds this run and holds nobody.
  publish:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      actions: read
      id-token: write

    env:
      DOTNET_NOLOGO: true
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Version
        env:
          GH_TOKEN: ${{ secrets.NSAIL_CREW_PAT }}
          ASKED: ${{ inputs.publish }}
        run: |
          VERSION="$ASKED"
          if [ -z "$VERSION" ]; then
            TAG=$(gh api "repos/nsail-ar/nsail/releases?per_page=1" -q '.[0].tag_name // empty')
            [ -n "$TAG" ] || { echo "::error::the monorepo has no release"; exit 1; }
            VERSION=$(gh api "repos/nsail-ar/nsail/contents/Directory.Build.props?ref=$TAG" -H "Accept: application/vnd.github.raw" \
              | sed -n 's:.*<NSailStackVersion>\(.*\)</NSailStackVersion>.*:\1:p')
            echo "$TAG runs on the Stack at $VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$VERSION' is not a released version"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Public already
        id: public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is public already"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - name: The build's packages
        if: steps.public.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" -q .object.sha)
          RUN=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main" \
            -q ".workflow_runs[] | select(.run_number == ${VERSION##*.}) | .id")
          [ -n "$RUN" ] || { echo "::error::no run of this workflow built v$VERSION"; exit 1; }
          gh run download "$RUN" --name packages --dir artifacts

      - name: NuGet login
        if: steps.public.outputs.done != 'true'
        id: nuget
        uses: NuGet/login@v1
        with:
          user: NSail

      - name: Publish NuGet
        if: steps.public.outputs.done != 'true'
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }}
          --skip-duplicate

      - uses: actions/setup-node@v5
        if: steps.public.outputs.done != 'true'
        with:
          node-version: 24

      # npm's Trusted Publishing: the CLI trades this run's OIDC token with npmjs.com, against
      # a trusted publisher each package names (this repository, this workflow file), and signs
      # the provenance. It needs npm 11.5.1 or later. npm refuses a version it already holds,
      # so a run that takes up a half-made publish skips what is there.
      - name: Publish npm
        if: steps.public.outputs.done != 'true'
        run: |
          npm install --global npm@^11.5.1
          for name in stack ui; do
            if [ -n "$(npm view "@nsail/$name@$VERSION" version 2> /dev/null)" ]; then
              echo "@nsail/$name@$VERSION is on npm already"
            else
              npm publish "artifacts/npm/nsail-$name-$VERSION.tgz" --access public --provenance
            fi
          done

      - name: Release page
        if: steps.public.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag
