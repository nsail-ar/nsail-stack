name: CI

# Build, test and pack on every pull request and every push to main. A run on main (a push,
# or a manual dispatch to retry one) is a
# release: the packages go to nuget.org as <VERSION_PREFIX>.<run> and the commit is tagged
# v<that version>, which is what a consumer pins. A pull request packs a -pr prerelease it
# never publishes. To start a new minor or major line, change VERSION_PREFIX.
#
# nuget.org is reached by Trusted Publishing: the NuGet/login step trades this run's OIDC
# token for a short-lived key, against a policy on the NSail nuget.org account that names
# this repository and this workflow file. No API key is stored anywhere.
#
# GitHub-hosted runners, never the monorepo's self-hosted iron: this repository goes public,
# and a fork's pull request on a self-hosted runner runs a stranger's code on our machine.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      id-token: write

    # The data harnesses create throwaway databases on a real Postgres. TestDatabase connects
    # as postgres@localhost and takes the password from PGPASSWORD (ConnectionStrings.Complete).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGPASSWORD: ci
      DOTNET_NOLOGO: true
      VERSION_PREFIX: '0.1'

    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "VERSION=$VERSION_PREFIX.${{ github.run_number }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$VERSION_PREFIX.${{ github.run_number }}-pr.${{ github.event.pull_request.number || 'manual' }}" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # The sample's host builds its React client during the .NET build.
      - name: npm install
        run: npm ci

      - name: Restore
        run: dotnet restore NSail.sln

      - name: Build
        run: dotnet build NSail.sln --configuration Release --no-restore -p:Version=$VERSION

      # After the build: the sample's sdk.ts is generated from the .NET Sdk assembly and is not
      # committed.
      - name: npm typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Test
        run: dotnet test NSail.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack NSail.sln --configuration Release --no-build -p:Version=$VERSION --output artifacts

      - uses: actions/upload-artifact@v5
        with:
          name: packages
          path: artifacts/*
          retention-days: 14

      - name: NuGet login
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: nuget
        uses: NuGet/login@v1
        with:
          user: NSail

      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }}
          --skip-duplicate

      - name: Tag
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
